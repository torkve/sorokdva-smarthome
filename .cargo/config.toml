# Static musl builds for the controller. The musl cross toolchains must be
# in PATH; build-static.sh adds ~/.local/opt/{aarch64-linux-musl-cross,
# armv7l-linux-musleabihf-cross, x86_64-linux-musl-native}/bin (prebuilt
# toolchains from https://musl.cc).

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"

[target.x86_64-unknown-linux-musl]
linker = "x86_64-linux-musl-gcc"

[env]
CC_aarch64_unknown_linux_musl = "aarch64-linux-musl-gcc"
AR_aarch64_unknown_linux_musl = "aarch64-linux-musl-ar"
CC_x86_64_unknown_linux_musl = "x86_64-linux-musl-gcc"
AR_x86_64_unknown_linux_musl = "x86_64-linux-musl-ar"
CC_armv7_unknown_linux_musleabihf = "armv7l-linux-musleabihf-gcc"
AR_armv7_unknown_linux_musleabihf = "armv7l-linux-musleabihf-ar"

[target.armv7-unknown-linux-musleabihf]
linker = "armv7l-linux-musleabihf-gcc"
