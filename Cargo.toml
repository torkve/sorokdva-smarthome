[package]
name = "sorokdva-smarthome"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
default = ["wirenboard", "influx"]
wirenboard = []
influx = []

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "time", "sync"] }
http = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
rumqttc = { version = "0.24", default-features = false }
hyper = { version = "1", default-features = false, features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
lexopt = "0.3"
percent-encoding = "2"
form_urlencoded = "1"
base64 = "0.22"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
getrandom = { version = "0.2", features = ["std"] }
anyhow = "1"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["test-util"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
